version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: roster_db
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster_user
      POSTGRES_PASSWORD: roster_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - roster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster_user -d roster"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: roster_api
    environment:
      DATABASE_URL: postgresql+asyncpg://roster_user:roster_password@db:5432/roster
      SOLVER_URL: http://solver:8001
      JWT_SECRET: super_secret_jwt_key_for_dev
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FACEBOOK_CLIENT_ID: ""
      FACEBOOK_CLIENT_SECRET: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - roster_network
    volumes:
      - ./services/api:/app
    restart: unless-stopped

  solver:
    build:
      context: ./services/solver
      dockerfile: Dockerfile
    container_name: roster_solver
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - roster_network
    volumes:
      - ./services/solver:/app
    restart: unless-stopped

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: roster_web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - roster_network
    volumes:
      - ./services/web:/app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  roster_network:
    driver: bridge
